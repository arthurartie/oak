<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oak · Sistema de Conteúdo</title>
<!-- Visual: design system da Artië (tokens de cores, Manrope, espaçamento, raios + componentes) -->
<link rel="stylesheet" href="artie-design-system/tokens.css">
<link rel="stylesheet" href="artie-design-system/components/cards.css">
<link rel="stylesheet" href="artie-design-system/components/botoes.css">
<style>
/* =========================================================
   Oak · Sistema de Conteúdo v0.3 (visual: design system da Artië)
   Tudo vem do design system: cores, fonte, espaçamento e raios
   são as variáveis do tokens.css. Nenhuma cor nova.
   ========================================================= */
:root{--sw:256px;--topo:64px;--px:var(--pagina-borda-x);--py:var(--pagina-borda-y)}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cor-fundo);color:var(--cor-texto);font:var(--pequeno-peso) var(--pequeno-tamanho)/var(--pequeno-entrelinha) var(--fonte);-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--cor-destaque-texto);outline-offset:2px;border-radius:var(--esp-2)}
::selection{background:var(--cor-destaque);color:var(--cor-sobre-destaque)}
.ic{width:var(--esp-4);height:var(--esp-4);flex:none}
.mute{color:var(--cor-texto-2)}
.dim{color:var(--cor-texto-3)}
.sm{font-size:var(--legenda-tamanho)}
.grow{flex:1}
.sp{flex:1}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.azul{color:var(--cor-destaque-texto)}
.mt{margin-top:var(--gap-cards)}.mb{margin-bottom:var(--gap-cards)}
.fontbar{position:fixed;top:0;left:0;right:0;z-index:99;background:var(--cor-destaque);color:var(--cor-sobre-destaque);padding:var(--esp-3) var(--esp-5);font-weight:700;text-align:center}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:var(--sw) minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;background:linear-gradient(var(--cor-superficie),var(--cor-superficie)),var(--cor-fundo);border-right:1px solid var(--cor-borda);display:flex;flex-direction:column;padding:var(--esp-5) var(--esp-3) var(--esp-4);overflow-y:auto;gap:var(--esp-1);z-index:50}
.ws{display:flex;align-items:center;gap:var(--esp-3);padding:0 var(--esp-3) var(--esp-5)}
.ws-logo{font:var(--display-peso) var(--t2-tamanho)/1 var(--fonte);letter-spacing:var(--display-espaco);color:var(--cor-texto);flex:none}
.ws-t{font-size:var(--legenda-tamanho);font-weight:600;color:var(--cor-texto-3);line-height:1.2;padding-left:var(--esp-3);border-left:1px solid var(--cor-borda)}
.nav-i{display:flex;align-items:center;gap:var(--esp-3);min-height:var(--esp-7);padding:0 var(--esp-3);border-radius:var(--raio-botao);color:var(--cor-texto-2);text-decoration:none;font-weight:600;width:100%;border:0;background:none;text-align:left;line-height:1.25}
.nav-i:hover{background:var(--cor-superficie);color:var(--cor-texto)}
.nav-i.on{background:var(--cor-destaque-suave);color:var(--cor-destaque-texto);font-weight:700}
.nav-i.search{color:var(--cor-texto-3);margin-bottom:var(--esp-3);box-shadow:inset 0 0 0 1px var(--cor-borda);background:var(--cor-fundo);font-weight:500}
.nav-h{padding:var(--esp-5) var(--esp-3) var(--esp-2);color:var(--cor-texto-3)}
.kbd{white-space:nowrap;flex:none;margin-left:auto;font-size:var(--legenda-tamanho);font-weight:600;color:var(--cor-texto-3);box-shadow:inset 0 0 0 1px var(--cor-borda);border-radius:var(--esp-1);padding:0 var(--esp-1)}
.count{margin-left:auto;font-size:var(--legenda-tamanho);font-weight:700;color:var(--cor-texto-3);font-variant-numeric:tabular-nums}
.count.strong{background:var(--cor-destaque);color:var(--cor-sobre-destaque);border-radius:var(--raio-tag);padding:0 var(--esp-2)}
.nav-i .chk{margin-left:auto;opacity:0}
.nav-i.sel{color:var(--cor-texto);font-weight:700}
.nav-i.sel .chk{opacity:1;color:var(--cor-destaque-texto)}
.side-foot{margin-top:auto;padding-top:var(--esp-4);border-top:1px solid var(--cor-borda);display:grid;gap:var(--esp-1)}
.ver{font-size:var(--legenda-tamanho);color:var(--cor-texto-3);padding:var(--esp-2) var(--esp-3) 0}
main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:var(--topo);display:flex;align-items:center;gap:var(--esp-2);padding:0 var(--px);background:var(--cor-fundo);border-bottom:1px solid var(--cor-borda)}
.crumb{display:flex;align-items:center;gap:var(--esp-2);color:var(--cor-texto-2);white-space:nowrap;overflow:hidden;font-weight:600}
.crumb b{color:var(--cor-texto);font-weight:700}
.crumb .sl{color:var(--cor-texto-3)}
.btn.menu-btn{display:none}
.page{width:100%;max-width:1680px;margin:0 auto;padding:var(--py) var(--px) var(--esp-12)}
.page.wide{max-width:none}
.fade{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}*{transition:none!important}}

/* ---------- botões (base: components/botoes.css) ---------- */
.btn{white-space:nowrap;justify-content:center;transition:background .12s,box-shadow .12s,opacity .12s;line-height:1}
.btn .ic{width:var(--esp-4);height:var(--esp-4)}
.btn--principal:hover{opacity:.88}
.btn--secundario:hover{background:var(--cor-superficie)}
.btn--fantasma{background:transparent;color:var(--cor-texto-2)}
.btn--fantasma:hover{background:var(--cor-superficie);color:var(--cor-texto)}
.btn.sm{padding:var(--esp-2) var(--esp-4)}
.btn.icon{padding:var(--esp-2)}
.btn.sm.icon{padding:var(--esp-2)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.danger{color:var(--cor-texto-2)}
.btn.danger.arm{background:var(--cor-texto);color:var(--cor-fundo);box-shadow:none}
.btns{flex-wrap:wrap}

/* ---------- tags e avatares ---------- */
.tag{display:inline-flex;align-items:center;gap:var(--esp-1);height:var(--esp-5);padding:0 var(--esp-3);border-radius:var(--raio-tag);background:var(--cor-superficie);font-size:var(--legenda-tamanho);color:var(--cor-texto-2);white-space:nowrap;font-weight:700}
.tag.line{background:none;box-shadow:inset 0 0 0 1px var(--cor-borda)}
.tag.strong{background:var(--cor-destaque-suave);color:var(--cor-destaque-texto)}
.tag.solid{background:var(--cor-destaque);color:var(--cor-sobre-destaque)}
.sti{width:var(--esp-4);height:var(--esp-4);flex:none;color:var(--cor-texto)}
.sti .sf{fill:var(--cor-destaque)}
.sti .sk{stroke:var(--cor-sobre-destaque)}
.sti .sd{fill:var(--cor-sobre-destaque)}
.sti .pf{fill:currentColor}
.sti .pk{stroke:var(--cor-fundo)}
.av{width:var(--esp-6);height:var(--esp-6);border-radius:50%;display:inline-grid;place-items:center;font-size:var(--legenda-tamanho);font-weight:800;flex:none;line-height:1}
.av.xs{width:var(--esp-5);height:var(--esp-5)}
.av.lg{width:var(--esp-8);height:var(--esp-8);font-size:var(--pequeno-tamanho)}
.t0{background:var(--cor-texto);color:var(--cor-fundo)}
.t1{background:var(--cor-fundo);color:var(--cor-texto);box-shadow:inset 0 0 0 1.5px var(--cor-texto)}
.t2{background:var(--cor-destaque);color:var(--cor-sobre-destaque)}
.t3{background:var(--cor-destaque-suave);color:var(--cor-destaque-texto)}

/* ---------- cabeçalho de página ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--esp-5) var(--esp-6);flex-wrap:wrap;margin-bottom:var(--gap-blocos)}
.ph .t-display{margin:0;text-wrap:balance}
.eyebrow{color:var(--cor-texto-3);margin-bottom:var(--esp-3);display:flex;align-items:center;gap:var(--esp-2)}
.sub{color:var(--cor-texto-2);margin:var(--esp-3) 0 0;max-width:70ch;text-wrap:pretty}
.sub b{color:var(--cor-texto);font-weight:700}

/* ---------- cards (base: components/cards.css) ---------- */
.card{min-width:0}
.bh{display:flex;align-items:center;gap:var(--esp-3);min-height:var(--esp-5)}
.bh .card-rotulo{margin:0}
.g{display:grid;gap:var(--gap-cards);grid-template-columns:repeat(12,minmax(0,1fr))}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.stack{display:grid;gap:var(--gap-cards);align-content:start}
.empty{box-shadow:inset 0 0 0 1px var(--cor-borda);border-radius:var(--raio-botao);padding:var(--esp-5);color:var(--cor-texto-2);display:grid;gap:var(--esp-3);justify-items:start}
.bar{height:var(--esp-2);border-radius:var(--raio-tag);background:var(--cor-borda);overflow:hidden}
.bar i{display:block;height:100%;background:var(--cor-destaque-texto);border-radius:var(--raio-tag)}
.card--destaque .bar{background:var(--cor-sobre-destaque-3)}
.card--destaque .bar i{background:var(--cor-sobre-destaque)}
.note{font-size:var(--legenda-tamanho);color:var(--cor-texto-3);margin:0}
.card--destaque .card-numero{font-variant-numeric:tabular-nums}

/* listas */
.rows{list-style:none;margin:0;padding:0}
.rows .r{display:flex;align-items:center;gap:var(--esp-3);padding:var(--esp-3);margin:0 calc(-1 * var(--esp-3));border-radius:var(--raio-botao);cursor:pointer}
.rows .r:hover{background:var(--cor-superficie)}
.rows .r b{font-weight:700;display:block;line-height:1.3}
.rows .r small{display:block;color:var(--cor-texto-2);font-size:var(--legenda-tamanho)}
.rows .r + .r{box-shadow:0 -1px 0 var(--cor-borda)}
.card--destaque .rows .r{color:var(--cor-sobre-destaque)}
.card--destaque .rows .r small{color:var(--cor-sobre-destaque-2)}
.card--destaque .rows .r + .r{box-shadow:0 -1px 0 var(--cor-sobre-destaque-3)}
.card--destaque .rows .r:hover{background:var(--cor-destaque-escuro)}
.card--destaque .sti{color:var(--cor-sobre-destaque)}
.card--destaque .sti .sf{fill:var(--cor-sobre-destaque)}
.card--destaque .sti .sk{stroke:var(--cor-destaque)}
.card--destaque .sti .sd{fill:var(--cor-destaque)}
.card--destaque .dim{color:var(--cor-sobre-destaque-3)}

/* pipeline */
.sbar{display:flex;height:var(--esp-3);gap:2px;border-radius:var(--raio-tag);overflow:hidden;background:var(--cor-superficie)}
.sbar i{display:block;height:100%}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:var(--esp-2);font-size:var(--legenda-tamanho);font-weight:600}
.legend li{display:flex;align-items:center;gap:var(--esp-2)}
.legend li.zero{color:var(--cor-texto-3)}
.legend b{font-variant-numeric:tabular-nums}
.sw{width:var(--esp-3);height:var(--esp-3);border-radius:var(--esp-1);flex:none}
.c-ideia{background:var(--cor-borda)}
.c-texto{background:var(--cor-texto-3)}
.c-design{background:var(--cor-texto-2)}
.c-revisar{background:var(--cor-destaque)}
.c-aprovado{background:repeating-linear-gradient(135deg,var(--cor-texto-2) 0 3px,var(--cor-borda) 3px 6px)}
.c-agendado{background:repeating-linear-gradient(135deg,var(--cor-texto) 0 3px,var(--cor-texto-3) 3px 6px)}
.c-publicado{background:var(--cor-texto)}

/* ---------- semana (faixa) ---------- */
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--esp-2)}
.wday{min-height:160px;border:1px solid var(--cor-borda);border-radius:var(--raio-botao);padding:var(--esp-2);background:var(--cor-fundo);display:flex;flex-direction:column;gap:var(--esp-2);transition:background .12s}
.wday.wkend{background:transparent;border-style:dashed}
.wday.today{border-color:var(--cor-destaque-texto);box-shadow:inset 0 0 0 1px var(--cor-destaque-texto)}
.wday .dh{display:flex;justify-content:space-between;align-items:center;font-size:var(--legenda-tamanho);font-weight:600;color:var(--cor-texto-3);padding:0 var(--esp-1)}
.wday .dh b{font-weight:800;color:var(--cor-texto);min-width:var(--esp-5);height:var(--esp-5);display:grid;place-items:center;border-radius:var(--raio-tag)}
.wday.today .dh b{background:var(--cor-destaque);color:var(--cor-sobre-destaque)}
.add-slot{margin-top:auto;border:1px dashed var(--cor-borda);border-radius:var(--esp-2);height:var(--esp-6);color:var(--cor-texto-3);background:none;opacity:0;display:grid;place-items:center;transition:opacity .12s}
.wday:hover .add-slot,.add-slot:focus-visible{opacity:1}
@media (hover:none){.add-slot{opacity:.7}}

/* ---------- cartão de post no calendário ---------- */
.pc{background:var(--cor-fundo);border:1px solid var(--cor-borda);border-radius:var(--esp-2);padding:var(--esp-2);cursor:pointer;font-size:var(--legenda-tamanho);line-height:1.35;text-align:left;user-select:none;-webkit-user-select:none;transition:border-color .12s,transform .12s;position:relative}
.pc:hover{border-color:var(--cor-texto-3)}
.pc .t{font-weight:700;color:var(--cor-texto);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pc .m{display:flex;align-items:center;gap:var(--esp-1);margin-top:var(--esp-2);color:var(--cor-texto-3);font-weight:600}
.pc .m .sp{flex:1}
.pc.pub .t{color:var(--cor-texto-2)}
.pc.rev{border-color:var(--cor-destaque-texto);box-shadow:inset 3px 0 0 var(--cor-destaque-texto)}
.pc.dragging{opacity:.35;transform:scale(.98)}
.pc.lg{padding:var(--esp-3);font-size:var(--pequeno-tamanho)}
.pc.lg .t{-webkit-line-clamp:3}
.pc .snip{color:var(--cor-texto-2);font-size:var(--legenda-tamanho);font-weight:500;margin-top:var(--esp-1);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.over{background:var(--cor-destaque-suave)!important;outline:1.5px dashed var(--cor-destaque-texto);outline-offset:-3px}

/* ---------- calendário ---------- */
.cal-bar{display:flex;align-items:center;gap:var(--esp-3);flex-wrap:wrap;margin-bottom:var(--esp-4)}
.cal-title{margin:0 var(--esp-2) 0 0;white-space:nowrap}
.cal-nav{display:inline-flex;gap:var(--esp-1);align-items:center}
.seg{display:inline-flex;background:var(--cor-superficie);border-radius:var(--raio-botao);padding:var(--esp-1);gap:var(--esp-1)}
.seg button{height:var(--esp-7);padding:0 var(--esp-4);border:0;background:none;border-radius:var(--esp-2);color:var(--cor-texto-2);display:inline-flex;gap:var(--esp-2);align-items:center;font-weight:700;white-space:nowrap}
.seg button.on{background:var(--cor-fundo);color:var(--cor-destaque-texto);box-shadow:inset 0 0 0 1px var(--cor-borda)}
.filters{display:flex;gap:var(--esp-2);flex-wrap:wrap;align-items:center;margin-bottom:var(--esp-4)}
.chipsel{display:inline-flex;align-items:center;height:var(--esp-7);box-shadow:inset 0 0 0 1px var(--cor-borda);border-radius:var(--raio-tag);padding:0 var(--esp-1) 0 var(--esp-4);font-size:var(--legenda-tamanho);font-weight:600;color:var(--cor-texto-3);background:var(--cor-fundo);gap:var(--esp-1)}
.chipsel select{border:0;background:none;color:var(--cor-texto);height:var(--esp-6);padding:0 var(--esp-2) 0 var(--esp-1);cursor:pointer;font-size:var(--legenda-tamanho);font-weight:700;max-width:200px}
.chipsel select:focus{outline:none}
.chipsel.on{background:var(--cor-destaque-suave);box-shadow:none;color:var(--cor-destaque-texto)}
.chipsel.on select{color:var(--cor-destaque-texto)}
.month{border:1px solid var(--cor-borda);border-radius:var(--raio-card);overflow:hidden;background:var(--cor-fundo)}
.mhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--cor-borda);background:var(--cor-superficie)}
.mhead div{padding:var(--esp-3);color:var(--cor-texto-3)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(144px,auto)}
.cell{border-right:1px solid var(--cor-borda);border-bottom:1px solid var(--cor-borda);padding:var(--esp-2);display:flex;flex-direction:column;gap:var(--esp-1);transition:background .12s}
.cell:nth-child(7n){border-right:0}
.mgrid .cell:nth-last-child(-n+7){border-bottom:0}
.cell.wk{background:var(--cor-superficie)}
.cell .dn{display:flex;align-items:center;justify-content:flex-end;height:var(--esp-6);gap:var(--esp-1)}
.cell .dn span{font-size:var(--legenda-tamanho);font-weight:700;color:var(--cor-texto-2);min-width:var(--esp-6);height:var(--esp-6);padding:0 var(--esp-2);display:grid;place-items:center;border-radius:var(--raio-tag);font-variant-numeric:tabular-nums}
.cell.out .dn span{color:var(--cor-texto-3);font-weight:500}
.cell.out .pc{opacity:.6}
.cell.today .dn span{background:var(--cor-destaque);color:var(--cor-sobre-destaque)}
.cell .dn .add{margin-right:auto;width:var(--esp-6);height:var(--esp-6);border-radius:var(--esp-2);border:0;background:none;color:var(--cor-texto-3);display:grid;place-items:center;opacity:0}
.cell:hover .dn .add,.cell .dn .add:focus-visible{opacity:1}
.cell .dn .add:hover{background:var(--cor-destaque-suave);color:var(--cor-destaque-texto)}
.cell .more{font-size:var(--legenda-tamanho);font-weight:700;color:var(--cor-texto-2);border:0;background:none;text-align:left;padding:var(--esp-1);border-radius:var(--esp-1)}
.cell .more:hover{background:var(--cor-superficie)}
.wk7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--cor-borda);border-radius:var(--raio-card);overflow:hidden;background:var(--cor-fundo);min-height:62vh}
.wk7 .col{border-right:1px solid var(--cor-borda);display:flex;flex-direction:column}
.wk7 .col:last-child{border-right:0}
.wk7 .col.wk{background:var(--cor-superficie)}
.wk7 .ch{padding:var(--esp-3);border-bottom:1px solid var(--cor-borda);display:flex;align-items:center;gap:var(--esp-2)}
.wk7 .ch small{color:var(--cor-texto-3);text-transform:capitalize}
.wk7 .ch b{min-width:var(--esp-6);height:var(--esp-6);display:grid;place-items:center;border-radius:var(--raio-tag)}
.wk7 .col.today .ch b{background:var(--cor-destaque);color:var(--cor-sobre-destaque)}
.wk7 .cb{padding:var(--esp-2);display:flex;flex-direction:column;gap:var(--esp-2);flex:1}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(264px,1fr);gap:var(--esp-3);overflow-x:auto;padding-bottom:var(--esp-3);scroll-snap-type:x proximity}
.bcol{background:var(--cor-superficie);border-radius:var(--raio-card);padding:var(--esp-2);min-height:420px;display:flex;flex-direction:column;gap:var(--esp-2);scroll-snap-align:start}
.bcol-h{display:flex;align-items:center;gap:var(--esp-2);padding:var(--esp-2);font-weight:800}
.tbl-wrap{border:1px solid var(--cor-borda);border-radius:var(--raio-card);overflow:auto;background:var(--cor-fundo)}
.tbl{width:100%;border-collapse:collapse;min-width:840px}
.tbl th{text-align:left;color:var(--cor-texto-3);padding:var(--esp-3) var(--esp-4);border-bottom:1px solid var(--cor-borda);background:var(--cor-superficie);white-space:nowrap}
.tbl td{padding:var(--esp-3) var(--esp-4);border-bottom:1px solid var(--cor-borda);vertical-align:middle;white-space:nowrap;font-size:var(--legenda-tamanho);font-weight:600;color:var(--cor-texto-2)}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--cor-superficie)}
.tbl tr.grp td{color:var(--cor-destaque-texto);cursor:default}
.tbl td.nm{white-space:normal;font-size:var(--pequeno-tamanho);font-weight:700;color:var(--cor-texto);min-width:280px}
.tbl .stc{display:inline-flex;align-items:center;gap:var(--esp-2)}
.mini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;border:1px solid var(--cor-borda);border-radius:var(--raio-card);padding:var(--esp-2)}
.mini .wh{color:var(--cor-texto-3);text-align:center;padding:var(--esp-1) 0 var(--esp-2)}
.mini button{border:0;background:none;border-radius:var(--raio-botao);height:var(--esp-9);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:var(--esp-1);padding-top:var(--esp-2);font-weight:700;font-variant-numeric:tabular-nums}
.mini button.out{color:var(--cor-texto-3);font-weight:500}
.mini button.today span{color:var(--cor-destaque-texto)}
.mini button.sel{background:var(--cor-destaque);color:var(--cor-sobre-destaque)}
.mini button.sel span{color:var(--cor-sobre-destaque)}
.mini .dots{display:flex;gap:2px;height:var(--esp-1)}
.mini .dots i{width:var(--esp-1);height:var(--esp-1);border-radius:50%;background:currentColor}
.agenda{margin-top:var(--esp-5);display:grid;gap:var(--esp-2)}
.ag-h{margin:var(--esp-1) var(--esp-1) 0}
.legend-row{display:flex;flex-wrap:wrap;gap:var(--esp-2) var(--esp-4);margin-top:var(--esp-4);color:var(--cor-texto-2);font-size:var(--legenda-tamanho);font-weight:600}
.legend-row span{display:inline-flex;align-items:center;gap:var(--esp-2)}

/* ---------- perfis ---------- */
.prow{display:grid;grid-template-columns:minmax(200px,1.3fr) minmax(140px,.8fr) minmax(0,1.7fr) 128px minmax(140px,.9fr);gap:var(--esp-5);align-items:center;padding:var(--esp-3);margin:0 calc(-1 * var(--esp-3));border-radius:var(--raio-botao);cursor:pointer}
.prow + .prow{box-shadow:0 -1px 0 var(--cor-borda)}
.prow:hover{background:var(--cor-fundo)}
.prow.hd{cursor:default;color:var(--cor-texto-3);padding-top:0}
.prow.hd:hover{background:none}
.c-who{display:flex;align-items:center;gap:var(--esp-3)}
.c-who b{font-weight:800;display:block;line-height:1.25}
.c-who small,.c-week small,.c-meta small{color:var(--cor-texto-3);font-size:var(--legenda-tamanho);font-weight:600;display:block}
.c-week{display:flex;align-items:center;gap:var(--esp-3)}
.wdots{display:flex;gap:var(--esp-1)}
.wdots i{width:var(--esp-3);height:var(--esp-3);border-radius:var(--esp-1);box-shadow:inset 0 0 0 1.5px var(--cor-borda)}
.wdots i.on{background:var(--cor-destaque-texto);box-shadow:none}
.wdots i.half{background:repeating-linear-gradient(135deg,var(--cor-destaque-texto) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1.5px var(--cor-destaque-texto)}
.c-next{display:flex;align-items:center;gap:var(--esp-2);font-size:var(--legenda-tamanho);font-weight:600}
.c-meta{display:grid;gap:var(--esp-1)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--gap-cards)}
.pcard{text-align:left;cursor:pointer;font:inherit;transition:border-color .12s}
.pcard:hover{border-color:var(--cor-texto-3)}
.pcard .who{display:flex;gap:var(--esp-3);align-items:center}
.pcard .who small{display:block;color:var(--cor-texto-2);font-size:var(--legenda-tamanho);font-weight:600}
.pcard .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--esp-2);border-top:1px solid var(--cor-borda);padding-top:var(--esp-4);margin-top:var(--esp-1)}
.pcard .stats b{display:block;font:var(--t3-peso) var(--t3-tamanho)/var(--t3-entrelinha) var(--fonte);color:var(--cor-destaque-texto);font-variant-numeric:tabular-nums}
.pcard .stats small{color:var(--cor-texto-3);font-size:var(--legenda-tamanho);font-weight:600}
.pcard.new{border-style:dashed;background:none;place-items:center;align-items:center;justify-content:center;color:var(--cor-texto-2);min-height:200px;font-weight:700}
.sec-h{margin:var(--gap-blocos) 0 var(--esp-4);color:var(--cor-texto-3);display:flex;align-items:center;gap:var(--esp-2)}

/* ---------- ideias ---------- */
.cap{display:flex;align-items:center;gap:var(--esp-2);box-shadow:inset 0 0 0 1.5px var(--cor-borda);border-radius:var(--raio-botao);padding:var(--esp-2) var(--esp-2) var(--esp-2) var(--esp-4);background:var(--cor-fundo);transition:box-shadow .12s}
.cap:focus-within{box-shadow:inset 0 0 0 1.5px var(--cor-destaque-texto)}
.cap .ic{color:var(--cor-texto-3)}
.cap input{flex:1;border:0;background:none;height:var(--esp-7);font-size:var(--pequeno-tamanho);font-weight:600;outline:none;min-width:120px}
.cap input::placeholder{color:var(--cor-texto-3)}
.cap select{border:0;background:var(--cor-superficie);border-radius:var(--esp-2);height:var(--esp-6);padding:0 var(--esp-2);font-size:var(--legenda-tamanho);font-weight:700;max-width:220px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:var(--gap-cards);align-items:start}
.icols{display:grid;grid-template-columns:repeat(auto-fit,minmax(264px,1fr));gap:var(--esp-4)}
.icol{background:var(--cor-superficie);border-radius:var(--raio-card);padding:var(--esp-3);display:flex;flex-direction:column;gap:var(--esp-2)}
.icol-h{display:flex;align-items:center;gap:var(--esp-2);padding:var(--esp-1) var(--esp-1) var(--esp-2);font-weight:800}
.icard{background:var(--cor-fundo);border:1px solid var(--cor-borda);border-radius:var(--raio-botao);padding:var(--esp-3);display:grid;gap:var(--esp-2)}
.icard p{margin:0;line-height:1.4;font-weight:700}
.icard .m{font-size:var(--legenda-tamanho);font-weight:600;color:var(--cor-texto-3);display:flex;gap:var(--esp-1);flex-wrap:wrap;align-items:center}
.icard .acts{display:flex;gap:var(--esp-1);opacity:0;transition:opacity .12s}
.icard:hover .acts,.icard:focus-within .acts{opacity:1}
@media (hover:none){.icard .acts{opacity:1}}

/* ---------- estúdio ---------- */
.studio{display:grid;grid-template-columns:minmax(0,1fr) minmax(400px,600px);gap:var(--gap-cards);align-items:start}
.pv{position:sticky;top:calc(var(--topo) + var(--esp-5));display:grid;gap:var(--esp-3)}
.pv-bg{background:var(--cor-superficie);border-radius:var(--raio-card);padding:var(--esp-6);display:grid;place-items:start center;min-height:420px}
.fld{display:grid;gap:var(--esp-2)}
.lbl{font-size:var(--legenda-tamanho);color:var(--cor-texto-3);font-weight:700}
.in{width:100%;border:0;box-shadow:inset 0 0 0 1.5px var(--cor-borda);background:var(--cor-fundo);border-radius:var(--raio-botao);padding:var(--esp-3) var(--esp-4);font-size:var(--pequeno-tamanho);font-weight:600;transition:box-shadow .12s}
.in:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--cor-destaque-texto)}
.in::placeholder{color:var(--cor-texto-3)}
textarea.in{resize:vertical;line-height:var(--corpo-entrelinha);font-weight:500}
select.in{height:var(--esp-8);padding:0 var(--esp-3)}
.row{display:flex;gap:var(--esp-2);align-items:center;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--esp-4)}
.pills{display:flex;gap:var(--esp-2);flex-wrap:wrap}
.pill{height:var(--esp-7);padding:0 var(--esp-4);border-radius:var(--raio-tag);border:0;box-shadow:inset 0 0 0 1.5px var(--cor-borda);background:var(--cor-fundo);font-size:var(--legenda-tamanho);font-weight:700;color:var(--cor-texto-2)}
.pill:hover{box-shadow:inset 0 0 0 1.5px var(--cor-texto-3);color:var(--cor-texto)}
.pill.on{background:var(--cor-destaque-suave);color:var(--cor-destaque-texto);box-shadow:inset 0 0 0 1.5px var(--cor-destaque-texto)}
.cc{display:flex;justify-content:space-between;gap:var(--esp-3);font-size:var(--legenda-tamanho);font-weight:600;color:var(--cor-texto-3);flex-wrap:wrap}
.cc b{color:var(--cor-texto)}
.hooks{list-style:none;margin:var(--esp-2) 0 0;padding:0;display:grid;gap:var(--esp-2)}
.hooks li{display:flex;gap:var(--esp-3);align-items:flex-start;box-shadow:inset 0 0 0 1px var(--cor-borda);border-radius:var(--raio-botao);padding:var(--esp-3);font-weight:600}
.hooks small{display:block;color:var(--cor-texto-3);font-size:var(--legenda-tamanho)}
.ai-dot{width:var(--esp-2);height:var(--esp-2);border-radius:50%;background:currentColor;display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.studio .card{gap:var(--esp-5)}

/* ---------- marca / raio-x ---------- */
.pil .top2{display:flex;justify-content:space-between;gap:var(--esp-3);font-weight:800;margin-bottom:var(--esp-2)}
.pil small{display:block;color:var(--cor-texto-2);font-size:var(--legenda-tamanho);font-weight:500;margin-top:var(--esp-2)}
.pil + .pil{margin-top:var(--esp-4)}
.chips{display:flex;gap:var(--esp-2);flex-wrap:wrap}
.chips.no .tag{text-decoration:line-through;text-decoration-color:var(--cor-texto-3);color:var(--cor-texto-3);background:none;box-shadow:inset 0 0 0 1px var(--cor-borda)}
.ol{margin:0;padding:0;list-style:none;counter-reset:n}
.ol li{counter-increment:n;display:grid;grid-template-columns:var(--esp-6) 1fr;gap:var(--esp-2);padding:var(--esp-3) 0;border-top:1px solid var(--cor-borda);color:var(--cor-texto-2)}
.ol li:first-child{border-top:0;padding-top:0}
.ol li::before{content:counter(n,decimal-leading-zero);font-size:var(--legenda-tamanho);font-weight:800;color:var(--cor-destaque-texto);padding-top:2px}
.rx{display:grid;grid-template-columns:var(--esp-6) minmax(0,1fr);gap:var(--esp-4);padding:var(--esp-4) 0;border-top:1px solid var(--cor-borda)}
.rx:first-of-type{border-top:0;padding-top:0}
.rx b{display:block;font:var(--t3-peso) var(--pequeno-tamanho)/1.4 var(--fonte);color:var(--cor-destaque-texto);margin-bottom:var(--esp-1)}
.dot{width:var(--esp-6);height:var(--esp-6);border-radius:50%;display:grid;place-items:center;font-weight:800}
.dot.mini{width:var(--esp-4);height:var(--esp-4);font-size:var(--legenda-tamanho)}
.d-alerta{background:var(--cor-destaque);color:var(--cor-sobre-destaque)}
.d-oportunidade{box-shadow:inset 0 0 0 1.5px var(--cor-destaque-texto);color:var(--cor-destaque-texto)}
.d-forca{background:var(--cor-superficie);box-shadow:inset 0 0 0 1px var(--cor-borda)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap-cards)}
.vbox{box-shadow:inset 0 0 0 1px var(--cor-borda);border-radius:var(--raio-botao);padding:var(--esp-5);background:var(--cor-fundo)}
.vbox.new{box-shadow:inset 0 0 0 1.5px var(--cor-destaque-texto)}
.vbox .lbl{display:block;margin-bottom:var(--esp-1)}
.vbox p{margin:0 0 var(--esp-4);white-space:pre-wrap}

/* ---------- resultados ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap-cards);margin-bottom:var(--gap-cards)}
.hbar{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) 56px;gap:var(--esp-3);align-items:center;font-size:var(--legenda-tamanho);font-weight:600}
.hbar + .hbar{margin-top:var(--esp-3)}
.hbar b{text-align:right;font-variant-numeric:tabular-nums}
.tbl input{width:96px;text-align:right;border:0;box-shadow:inset 0 0 0 1px transparent;background:none;border-radius:var(--esp-2);padding:var(--esp-1) var(--esp-2);font-size:var(--pequeno-tamanho);font-weight:700;font-variant-numeric:tabular-nums}
.tbl input:hover{box-shadow:inset 0 0 0 1px var(--cor-borda)}
.tbl input:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--cor-destaque-texto);background:var(--cor-fundo)}
.tbl td.n,.tbl th.n{text-align:right}
.card .tbl-wrap{border:0;background:none}
.card .tbl th{background:none}

/* ---------- biblioteca ---------- */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(264px,1fr));gap:var(--gap-cards)}
.lib code{font-size:var(--legenda-tamanho);font-weight:600;color:var(--cor-texto-3);font-family:var(--fonte)}

/* ---------- aprovação ---------- */
.apr{max-width:680px;margin:0 auto;display:grid;gap:var(--gap-cards)}

/* ---------- prévia LinkedIn ---------- */
.li{background:var(--cor-fundo);color:var(--cor-texto);border-radius:var(--esp-2);border:1px solid var(--cor-borda);width:100%;max-width:560px;margin-inline:auto;overflow:hidden;text-align:left;transition:max-width .25s;font-size:var(--pequeno-tamanho)}
.li.mob{max-width:376px}
.li-h{display:flex;gap:var(--esp-2);padding:var(--esp-3) var(--esp-4) var(--esp-1)}
.li-h .av{width:var(--esp-8);height:var(--esp-8);font-size:var(--pequeno-tamanho)}
.li-h b{display:block;font-weight:800;line-height:1.3}
.li-h small{display:block;color:var(--cor-texto-2);font-size:var(--legenda-tamanho);font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.li-t{padding:var(--esp-2) var(--esp-4) var(--esp-3);white-space:pre-wrap;overflow-wrap:anywhere;font-weight:500;line-height:1.45}
.li-more{border:0;background:none;color:var(--cor-texto-2);padding:0;font:inherit;font-weight:700;cursor:pointer}
.li-more:hover{color:var(--cor-destaque-texto)}
.li-ph{color:var(--cor-texto-3)}
.li-img{aspect-ratio:4/5;background:var(--cor-destaque);color:var(--cor-sobre-destaque);display:flex;flex-direction:column;justify-content:flex-end;padding:var(--esp-6);position:relative;overflow:hidden}
.li-img.img{aspect-ratio:1/1}
.li-img svg{position:absolute;right:calc(-1 * var(--esp-6));top:calc(-1 * var(--esp-6));width:72%;color:var(--cor-sobre-destaque-3);opacity:.6}
.li-img p{font:var(--display-peso) var(--t2-tamanho)/var(--t2-entrelinha) var(--fonte);letter-spacing:var(--t2-espaco);margin:0;position:relative;text-wrap:balance}
.li-img .by{font-size:var(--legenda-tamanho);font-weight:700;letter-spacing:var(--legenda-espaco);text-transform:uppercase;color:var(--cor-sobre-destaque-2);margin-top:var(--esp-3);position:relative}
.li-img .pg{position:absolute;top:var(--esp-4);right:var(--esp-4);background:var(--cor-destaque-escuro);border-radius:var(--raio-tag);padding:var(--esp-1) var(--esp-3);font-size:var(--legenda-tamanho);font-weight:700}
.li-img .kick{position:absolute;top:var(--esp-5);left:var(--esp-6);font-size:var(--legenda-tamanho);font-weight:700;letter-spacing:var(--legenda-espaco);text-transform:uppercase;color:var(--cor-sobre-destaque-2)}
.li-quote{background:var(--cor-superficie);padding:var(--esp-7) var(--esp-6);aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:center}
.li-quote span{font:var(--display-peso) var(--display-tamanho)/.6 var(--fonte);color:var(--cor-destaque-texto)}
.li-quote p{font:var(--t2-peso) var(--t2-tamanho)/var(--t2-entrelinha) var(--fonte);margin:var(--esp-4) 0}
.li-quote small{font-size:var(--legenda-tamanho);font-weight:700;letter-spacing:var(--legenda-espaco);text-transform:uppercase;color:var(--cor-texto-3)}
.li-photo{aspect-ratio:4/5;background:var(--cor-superficie);display:grid;place-items:center;align-content:center;gap:var(--esp-2);color:var(--cor-texto-3);font-weight:700}
.li-photo .ic{width:var(--esp-9);height:var(--esp-9);stroke-width:1}
.li-vid{aspect-ratio:16/9;background:var(--cor-texto);color:var(--cor-fundo);display:grid;place-items:center;align-content:center;gap:var(--esp-3);padding:var(--esp-5);text-align:center}
.li-vid i{width:var(--esp-9);height:var(--esp-9);border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--cor-fundo);display:grid;place-items:center}
.li-vid i::after{content:"";border-left:14px solid var(--cor-fundo);border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:var(--esp-1)}
.li-vid p{margin:0;font:var(--t3-peso) var(--t3-tamanho)/var(--t3-entrelinha) var(--fonte);max-width:80%}
.li-poll{margin:0 var(--esp-4) var(--esp-3);box-shadow:inset 0 0 0 1px var(--cor-borda);border-radius:var(--esp-2);padding:var(--esp-4)}
.li-poll div{box-shadow:inset 0 0 0 1.5px var(--cor-destaque-texto);color:var(--cor-destaque-texto);border-radius:var(--raio-tag);padding:var(--esp-2) var(--esp-3);text-align:center;font-weight:800;margin-top:var(--esp-2)}
.li-poll small{display:block;color:var(--cor-texto-3);margin-top:var(--esp-3);font-size:var(--legenda-tamanho);font-weight:600}
.li-f{display:flex;justify-content:space-between;padding:var(--esp-2) var(--esp-4);color:var(--cor-texto-3);font-size:var(--legenda-tamanho);font-weight:600}
.li-a{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--cor-borda);margin:0 var(--esp-3)}
.li-a span{text-align:center;padding:var(--esp-3) 0;color:var(--cor-texto-2);font-weight:700;font-size:var(--legenda-tamanho)}

/* ---------- painel lateral (side peek) ---------- */
.scrim{position:fixed;inset:0;background:var(--cor-fundo);opacity:0;pointer-events:none;transition:opacity .2s;z-index:45}
.scrim.on{opacity:.72;pointer-events:auto}
.peek{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--cor-fundo);border-left:1px solid var(--cor-borda);transform:translateX(104%);transition:transform .26s cubic-bezier(.2,.8,.2,1);z-index:46;display:flex;flex-direction:column;visibility:hidden}
.peek.on{transform:none;visibility:visible}
.pk-top{height:var(--topo);display:flex;align-items:center;gap:var(--esp-1);padding:0 var(--esp-4);border-bottom:1px solid var(--cor-borda);flex:none}
.pk-top .crumb{margin-left:var(--esp-1)}
.pk-body{overflow-y:auto;padding:var(--esp-7) var(--esp-8) var(--esp-12);flex:1;overscroll-behavior:contain}
.pk-title{font:var(--t2-peso) var(--t2-tamanho)/var(--t2-entrelinha) var(--fonte);letter-spacing:var(--t2-espaco);border:0;background:none;width:100%;resize:none;padding:0;outline:none;overflow:hidden;color:var(--cor-texto)}
.pk-title::placeholder{color:var(--cor-texto-3)}
.props{display:grid;grid-template-columns:160px minmax(0,1fr);gap:2px var(--esp-2);margin:var(--esp-5) 0}
.props .k{display:flex;align-items:center;gap:var(--esp-2);color:var(--cor-texto-3);min-height:var(--esp-7);font-weight:600}
.props .v{display:flex;align-items:center;gap:var(--esp-2);border-radius:var(--esp-2);padding-left:var(--esp-2);font-weight:700}
.props .v:hover{background:var(--cor-superficie)}
.props .v select,.props .v input{height:var(--esp-7);border:0;background:none;padding:0 var(--esp-1);width:100%;cursor:pointer;-webkit-appearance:none;appearance:none;font-weight:700;outline:none}
.props .v input[type=date]::-webkit-calendar-picker-indicator{opacity:.5}
.hr{height:1px;background:var(--cor-borda);margin:0 0 var(--esp-5)}
details.tg{margin:0 0 var(--esp-3)}
details.tg summary{list-style:none;display:flex;align-items:center;gap:var(--esp-2);font-weight:800;cursor:pointer;padding:var(--esp-2);margin:0 calc(-1 * var(--esp-2));border-radius:var(--esp-2);user-select:none}
details.tg summary::-webkit-details-marker{display:none}
details.tg summary:hover{background:var(--cor-superficie)}
details.tg summary .chev{transition:transform .15s;color:var(--cor-texto-3)}
details.tg[open] summary .chev{transform:rotate(90deg)}
details.tg summary .ic:not(.chev){color:var(--cor-destaque-texto)}
.tg-b{padding:var(--esp-2) 0 var(--esp-2) var(--esp-6)}
.doc{width:100%;border:0;background:none;resize:none;font:var(--corpo-peso) var(--corpo-tamanho)/var(--corpo-entrelinha) var(--fonte);padding:var(--esp-1) 0;outline:none;min-height:120px;overflow:hidden;color:var(--cor-texto)}
.doc.short{min-height:var(--esp-7)}
.doc::placeholder{color:var(--cor-texto-3)}
.callout{display:flex;gap:var(--esp-3);background:var(--cor-destaque-suave);color:var(--cor-destaque-texto);border-radius:var(--raio-botao);padding:var(--esp-4);margin-bottom:var(--esp-5);font-weight:600}
.callout b{display:block;font-weight:800}
.mgrid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--esp-2)}
.mgrid4 label{display:grid;gap:var(--esp-1);font-size:var(--legenda-tamanho);font-weight:700;color:var(--cor-texto-3)}
.mgrid4 input{border:0;box-shadow:inset 0 0 0 1.5px var(--cor-borda);border-radius:var(--esp-2);padding:var(--esp-2);background:var(--cor-fundo);font-weight:700;font-variant-numeric:tabular-nums;width:100%}
.pk-foot{margin-top:var(--esp-7);padding-top:var(--esp-4);border-top:1px solid var(--cor-borda);display:flex;gap:var(--esp-2);flex-wrap:wrap}

/* ---------- busca (Ctrl K), modal, aviso ---------- */
.cmd,.ov{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;padding:12vh var(--esp-4) var(--esp-4)}
.cmd{z-index:70}.ov{z-index:80;overflow:auto;padding-top:8vh}
.cmd.on,.ov.on{display:flex}
.cmd::before,.ov::before{content:"";position:fixed;inset:0;background:var(--cor-fundo);opacity:.78}
.cmd-box,.md{position:relative;background:var(--cor-fundo);border:1px solid var(--cor-borda);border-radius:var(--raio-card);overflow:hidden;animation:fade .16s ease}
.cmd-box{width:min(680px,100%)}
.cmd-in{display:flex;align-items:center;gap:var(--esp-3);padding:0 var(--esp-5);border-bottom:1px solid var(--cor-borda)}
.cmd-in .ic{color:var(--cor-destaque-texto)}
.cmd-in input{flex:1;border:0;background:none;height:var(--esp-9);font-size:var(--corpo-tamanho);font-weight:600;outline:none}
.cmd-in input::placeholder{color:var(--cor-texto-3)}
.cmd-list{max-height:min(56vh,480px);overflow-y:auto;padding:var(--esp-2)}
.cmd-g{color:var(--cor-texto-3);padding:var(--esp-3) var(--esp-3) var(--esp-1)}
.cmd-i{display:flex;align-items:center;gap:var(--esp-3);padding:var(--esp-2) var(--esp-3);border-radius:var(--raio-botao);cursor:pointer;font-weight:600}
.cmd-i .ic{color:var(--cor-texto-3)}
.cmd-i small{margin-left:auto;color:var(--cor-texto-3);font-size:var(--legenda-tamanho);white-space:nowrap}
.cmd-i.on{background:var(--cor-destaque-suave);color:var(--cor-destaque-texto)}
.cmd-i.on .ic{color:var(--cor-destaque-texto)}
.cmd-foot{display:flex;gap:var(--esp-4);padding:var(--esp-3) var(--esp-5);border-top:1px solid var(--cor-borda);font-size:var(--legenda-tamanho);font-weight:600;color:var(--cor-texto-3)}
.md{width:min(640px,100%);padding:var(--card-interno);display:grid;gap:var(--esp-4)}
.md .t-h2{margin:0}
.toast{position:fixed;bottom:var(--esp-5);left:50%;transform:translate(-50%,var(--esp-2));background:var(--cor-texto);color:var(--cor-fundo);padding:var(--esp-3) var(--esp-5);border-radius:var(--raio-botao);font-weight:700;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;z-index:90;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- barra inferior (celular) ---------- */
.tabbar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:30;grid-template-columns:repeat(5,1fr);background:var(--cor-fundo);border-top:1px solid var(--cor-borda);padding:var(--esp-2) var(--esp-2) calc(var(--esp-2) + env(safe-area-inset-bottom))}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:var(--esp-1);font-size:var(--legenda-tamanho);font-weight:700;color:var(--cor-texto-3);text-decoration:none;padding:var(--esp-1) 0;border:0;background:none}
.tabbar .on{color:var(--cor-destaque-texto)}
.tabbar .ic{width:var(--esp-5);height:var(--esp-5)}
.tabbar .fab{width:var(--esp-9);height:var(--esp-8);border-radius:var(--raio-botao);background:var(--cor-destaque);color:var(--cor-sobre-destaque);display:grid;place-items:center;place-self:center;padding:0}

/* ---------- v0.4 · seletor de perfil ---------- */
.psw{display:grid;gap:var(--esp-2);margin:0 0 var(--esp-3);padding:var(--esp-2);border-radius:var(--raio-card);background:var(--cor-fundo);box-shadow:inset 0 0 0 1px var(--cor-borda)}
.psw-h{color:var(--cor-texto-3);padding:var(--esp-1) var(--esp-2) 0}
.psw-cur{display:flex;align-items:center;gap:var(--esp-3);width:100%;border:0;background:none;padding:var(--esp-2);border-radius:var(--raio-botao);text-align:left;cursor:pointer}
.psw-cur:hover{background:var(--cor-superficie)}
.psw-cur b{display:block;font-weight:800;line-height:1.25}
.psw-cur small{display:block;color:var(--cor-texto-3);font-size:var(--legenda-tamanho);font-weight:600}
.psw-cur .chev{color:var(--cor-texto-3);transition:transform .15s}
.psw.open .psw-cur .chev{transform:rotate(90deg)}
.psw-av{display:flex;gap:var(--esp-1);flex-wrap:wrap;padding:0 var(--esp-2) var(--esp-1)}
.psw-av button{border:0;background:none;padding:2px;border-radius:50%;cursor:pointer;display:grid}
.psw-av button.on{box-shadow:0 0 0 2px var(--cor-destaque-texto)}
.psw-list{display:none;border-top:1px solid var(--cor-borda);padding-top:var(--esp-2)}
.psw.open .psw-list{display:grid;gap:2px}
.psw-q{width:100%;border:0;box-shadow:inset 0 0 0 1px var(--cor-borda);border-radius:var(--esp-2);background:var(--cor-fundo);padding:var(--esp-2) var(--esp-3);font-weight:600;margin-bottom:var(--esp-1)}
.psw-q:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--cor-destaque-texto)}
.psw-g{padding:var(--esp-2) var(--esp-3) var(--esp-1);color:var(--cor-texto-3)}
.av .ic{width:var(--esp-4);height:var(--esp-4)}
.eyebrow{flex-wrap:wrap}
.active-chip{display:inline-flex;align-items:center;gap:var(--esp-2);height:var(--esp-6);padding:0 var(--esp-2) 0 var(--esp-1);border-radius:var(--raio-tag);background:var(--cor-destaque-suave);color:var(--cor-destaque-texto);font-size:var(--legenda-tamanho);font-weight:800;border:0;cursor:pointer;white-space:nowrap;max-width:100%}
.active-chip span{overflow:hidden;text-overflow:ellipsis}
.active-chip .chev{opacity:.7}
.active-chip:hover{box-shadow:inset 0 0 0 1.5px var(--cor-destaque-texto)}
.top .active-chip{max-width:240px}

/* ---------- v0.4 · copiar texto, comentários, kit ---------- */
.pc .cp{position:absolute;top:var(--esp-1);right:var(--esp-1);width:var(--esp-6);height:var(--esp-6);border-radius:var(--esp-2);border:0;background:var(--cor-fundo);box-shadow:inset 0 0 0 1px var(--cor-borda);color:var(--cor-texto-2);display:grid;place-items:center;opacity:0;transition:opacity .12s,background .12s;cursor:pointer;z-index:1}
.pc:hover .cp,.pc:focus-within .cp,.pc .cp:focus-visible{opacity:1}
.pc .cp:hover,.pc .cp.ok{background:var(--cor-destaque);color:var(--cor-sobre-destaque);box-shadow:none;opacity:1}
.pc.lg .t{padding-right:var(--esp-6)}
@media (hover:none){.pc .cp{opacity:1}.pc .t{padding-right:var(--esp-6)}}
.cm-badge{display:inline-flex;align-items:center;gap:2px;color:var(--cor-destaque-texto);font-weight:800}
.cm-badge .ic{width:var(--esp-3);height:var(--esp-3)}
.flash{animation:flash 1.8s ease}
@keyframes flash{0%,45%{box-shadow:0 0 0 3px var(--cor-destaque-texto)}100%{box-shadow:0 0 0 0 transparent}}
.cg{display:grid;gap:var(--esp-2);padding:var(--esp-3) 0}
.cg + .cg{border-top:1px solid var(--cor-borda)}
.cg-h{display:flex;align-items:center;gap:var(--esp-2);border:0;background:none;padding:0;text-align:left;cursor:pointer;font-weight:800;width:100%;min-width:0}
.cg-h .ell{flex:1}
.cg-h:hover{color:var(--cor-destaque-texto)}
.cg-h small{color:var(--cor-texto-3);font-size:var(--legenda-tamanho);font-weight:600;margin-left:auto;white-space:nowrap}
.cmt{display:grid;gap:var(--esp-1);padding:var(--esp-3);border-radius:var(--raio-botao);background:var(--cor-superficie);border:0;text-align:left;width:100%;font:inherit;color:inherit}
button.cmt{cursor:pointer}
button.cmt:hover{box-shadow:inset 0 0 0 1.5px var(--cor-destaque-texto)}
.cmt-h{display:flex;align-items:center;gap:var(--esp-2);flex-wrap:wrap}
.cmt-h b{font-weight:800}
.cmt-h small{color:var(--cor-texto-3);font-size:var(--legenda-tamanho);font-weight:600}
.cmt-t{color:var(--cor-texto-2);font-weight:500}
.cmt.res{opacity:.55}
.cmt.res .cmt-t{text-decoration:line-through}
.cmts{display:grid;gap:var(--esp-2)}
.up{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--esp-3);align-items:center}
.up-d{min-width:var(--esp-8);text-align:center;border-radius:var(--raio-botao);background:var(--cor-superficie);padding:var(--esp-1) var(--esp-2);font-size:var(--legenda-tamanho);font-weight:800;line-height:1.2}
.up-d b{display:block;font-size:var(--t3-tamanho);color:var(--cor-destaque-texto)}
.pill .ic{width:var(--esp-3);height:var(--esp-3);margin-right:var(--esp-1);vertical-align:-1px}
.pill.kit{box-shadow:inset 0 0 0 1.5px var(--cor-destaque-texto)}
.pill.kit:not(.on){color:var(--cor-destaque-texto)}
.pin{display:inline-flex;align-items:center;gap:var(--esp-1);height:var(--esp-6);padding:0 var(--esp-3);border-radius:var(--raio-tag);border:0;box-shadow:inset 0 0 0 1px var(--cor-borda);background:var(--cor-fundo);color:var(--cor-texto-2);font-size:var(--legenda-tamanho);font-weight:800;cursor:pointer;white-space:nowrap}
.pin .ic{width:var(--esp-3);height:var(--esp-3)}
.pin.on{background:var(--cor-destaque-suave);color:var(--cor-destaque-texto);box-shadow:none}
.pin.on .ic{fill:currentColor}
.librow{display:flex;align-items:center;gap:var(--esp-3);padding:var(--esp-3) 0;border-top:1px solid var(--cor-borda)}
.librow:first-of-type{border-top:0}
.librow b{font-weight:800;display:block}
.librow small{display:block;color:var(--cor-texto-2);font-size:var(--legenda-tamanho);font-weight:500}
.libsec{display:grid;gap:var(--esp-2)}
.libsec + .libsec{padding-top:var(--esp-4);border-top:1px solid var(--cor-borda)}
.libsec-h{display:flex;align-items:center;gap:var(--esp-2)}
.kitline{display:grid;gap:var(--esp-2)}
.kitline .lbl{margin-top:var(--esp-1)}
.refgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--gap-cards)}
.reflink{color:var(--cor-destaque-texto);font-weight:700;overflow-wrap:anywhere;text-decoration:none}
.reflink:hover{text-decoration:underline}
.refform{display:grid;grid-template-columns:auto minmax(0,1.3fr) minmax(0,1.3fr) auto auto;gap:var(--esp-2);align-items:center}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--esp-2)}
.flow div{border-radius:var(--raio-botao);background:var(--cor-superficie);padding:var(--esp-3);display:grid;gap:var(--esp-1)}
.flow b{color:var(--cor-destaque-texto);font-weight:800}
.flow small{color:var(--cor-texto-2);font-size:var(--legenda-tamanho);font-weight:600}
@media (max-width:1279px){.refform{grid-template-columns:1fr 1fr}.refform .in:nth-child(2),.refform .in:nth-child(3){grid-column:span 2}}
@media (max-width:719px){.flow{grid-template-columns:1fr}.refform{grid-template-columns:1fr}.refform .in:nth-child(2),.refform .in:nth-child(3){grid-column:auto}.top .active-chip{max-width:150px}}

/* ---------- responsivo ---------- */

 .s3,.s4,.s5{grid-column:span 6}.s7,.s8{grid-column:span 12}

 .board{grid-auto-columns:minmax(78vw,1fr);margin:0 calc(-1 * var(--px));padding-inline:var(--px);scroll-padding-inline:var(--px)}

 .cmd{padding-top:8vh}

 .filters::-webkit-scrollbar{display:none}

/* =========================================================
   v0.5 · Barra lateral flutuante
   Vidro fosco escuro nos dois temas: o <aside> leva data-theme="dark",
   então a barra e o seletor usam sempre os valores escuros abaixo.
   ========================================================= */
:root{
 --sbw:240px;--sb-gap:16px;
 --sb-bg-top:var(--cor-superficie);--sb-bg-bottom:var(--cor-superficie);
 --sb-border:var(--cor-borda);--sb-highlight:transparent;--sb-shadow:0 0 0 transparent;
 --sb-text:var(--cor-texto-2);--sb-text-strong:var(--cor-texto);--sb-text-muted:var(--cor-texto-3);
 --sb-divider:var(--cor-borda);--sb-hover:var(--cor-superficie);
 --sb-accent:var(--cor-destaque);--sb-accent-soft:var(--cor-destaque-suave);--sb-active-fade:transparent;--sb-accent-glow:transparent;--sb-ind-glow:0 0 0 transparent;
 --sb-active-border:var(--cor-borda);--sb-active-text:var(--cor-destaque-texto);--sb-active-inset:transparent;
 --sb-badge-border:var(--cor-borda);--sb-dot-ring:var(--cor-fundo);
 --sb-radius:24px;--sb-item-radius:999px;
}
html.sb-col{--sbw:72px}
[data-theme=dark]{
 --sb-bg-top:#1c1c1f;--sb-bg-bottom:#0d0d0f;
 --sb-border:rgba(255,255,255,.08);--sb-highlight:rgba(255,255,255,.06);--sb-shadow:0 20px 40px rgba(0,0,0,.5);
 --sb-text:#d4d4d8;--sb-text-strong:#ffffff;--sb-text-muted:#8a8a93;
 --sb-divider:rgba(255,255,255,.06);--sb-hover:rgba(255,255,255,.04);
 --sb-accent:#0F2DBD;--sb-accent-soft:rgba(15,45,189,.45);--sb-active-fade:rgba(255,255,255,.03);--sb-accent-glow:rgba(15,45,189,.40);--sb-ind-glow:0 0 10px #0F2DBD,0 0 4px rgba(255,255,255,.3);
 --sb-active-border:rgba(255,255,255,.12);--sb-active-text:#ffffff;--sb-active-inset:rgba(255,255,255,.08);
 --sb-badge-border:rgba(255,255,255,.18);--sb-dot-ring:#0d0d0f;
}
.app{display:block}
main{margin-left:calc(var(--sbw) + var(--sb-gap) * 2);transition:margin-left .25s ease;min-height:100dvh}
.sb{position:fixed;top:var(--sb-gap);bottom:var(--sb-gap);left:var(--sb-gap);width:var(--sbw);z-index:50;padding:20px 12px;display:flex;flex-direction:column;gap:4px;
 background:linear-gradient(160deg,var(--sb-bg-top),var(--sb-bg-bottom) 60%),var(--cor-fundo);
 border:1px solid var(--sb-border);border-radius:var(--sb-radius);
 box-shadow:inset 0 1px 0 var(--sb-highlight),var(--sb-shadow);
 color:var(--sb-text);font-family:var(--fonte);
 transition:width .25s ease,border-radius .25s ease,transform .24s cubic-bezier(.2,.8,.2,1)}
.sb .ic{width:20px;height:20px;stroke-width:1.5}
.sb-brand{display:flex;align-items:center;gap:12px;padding:0 4px 16px;min-height:40px}
.sb-mark{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font:var(--display-peso) var(--t3-tamanho)/1 var(--fonte);letter-spacing:-.02em;color:var(--sb-text-strong);background:var(--sb-hover);box-shadow:inset 0 0 0 1px var(--sb-border)}
.sb-name{display:grid;line-height:1.2;min-width:0;flex:1}
.sb-name b{font:var(--display-peso) var(--pequeno-tamanho)/1.15 var(--fonte);color:var(--sb-text-strong);letter-spacing:-.01em}
.sb-name small{font-size:var(--legenda-tamanho);font-weight:600;color:var(--sb-text-muted);white-space:nowrap}
.sb-psw{position:relative}
.sb-prof{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:5px 12px 5px 5px;border:1px solid var(--sb-border);border-radius:999px;background:var(--sb-hover);color:var(--sb-text);text-align:left;cursor:pointer;font-family:var(--fonte);transition:border-color .15s,background .15s}
.sb-prof:hover,.sb-prof[aria-expanded=true]{border-color:var(--sb-active-border)}
.sb-prof .av{width:40px;height:40px}
.sb-prof-t{display:grid;min-width:0;flex:1;line-height:1.25}
.sb-prof-t b{font-size:14px;font-weight:700;color:var(--sb-text-strong)}
.sb-prof-t small{font-size:12px;font-weight:600;color:var(--sb-text-muted)}
.sb-prof-chev{color:var(--sb-text-muted);display:grid}
.sb-prof-chev .ic{width:16px;height:16px}
.sbp{position:absolute;top:0;left:calc(100% + 24px);width:288px;z-index:60;padding:12px;display:grid;gap:4px;background:linear-gradient(160deg,var(--sb-bg-top),var(--sb-bg-bottom) 60%),var(--cor-fundo);border:1px solid var(--sb-border);border-radius:20px;box-shadow:inset 0 1px 0 var(--sb-highlight),var(--sb-shadow);color:var(--sb-text);animation:fade .16s ease}
.sbp-h{color:var(--sb-text-muted);padding:4px 8px}
.sbp .psw-q{background:transparent;color:var(--sb-text-strong);box-shadow:inset 0 0 0 1px var(--sb-border);border-radius:999px;padding:8px 14px;font-size:14px;margin:4px 0}
.sbp .psw-q::placeholder{color:var(--sb-text-muted)}
.sbp .psw-q:focus{box-shadow:inset 0 0 0 1.5px var(--sb-active-text)}
.sbp .psw-list{display:grid;gap:2px;border:0;padding:0}
.sbp-g{color:var(--sb-text-muted);padding:8px 10px 2px}
.sbp-i{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border:0;border-radius:999px;background:none;color:var(--sb-text);font:600 14px/1.2 var(--fonte);text-align:left;cursor:pointer}
.sbp-i:hover{background:var(--sb-hover);color:var(--sb-text-strong)}

  ${row('image','Modelo',sel('modelo',Object.entries(MOD),p.modelo))}

 </div>

 <details class="tg" open><summary>${I('chr','chev')}${I('text')}Texto</summary><div class="tg-b"><textarea class="doc" data-f="texto" placeholder="Escreva o post ou mande para o Estúdio gerar o rascunho.">${h(p.texto||'')}</textarea><div class="cc"><span id="pkCount"><b>${len}</b> caracteres</span><span>210 aparecem antes do "… mais"</span></div></div></details>

function newPost(d,pid){pid=pid||(U.scope!=='all'?U.scope:S.profiles[0].id);const pr=prof(pid);
 const p={id:uid('p'),pid,titulo:'',status:'ideia',data:d||nextFree(pid),modelo:pr.kit?.mod[0]||'img',pilar:pr.marca.pilares[0]?.id||'',funil:'topo',texto:'',arte:'',r:null,comentarios:[]};
 S.posts.push(p);save();renderView();renderSide();openPeek(p.id,true)}
function nextFree(pid){for(let i=1;i<60;i++){const d=wd(i);if(!S.posts.some(p=>p.pid===pid&&p.data===d))return d}return wd(1)}

 if(j){try{o=JSON.parse(j.slice(j.indexOf('{'),j.lastIndexOf('}')+1))}catch(e){toast('Esse JSON não abriu. Confira se copiou inteiro.');return}}
 const nome=$('#nN').value.trim()||o.nome;if(!nome){toast('Coloque pelo menos o nome');return}
 const emp=$('#nE').value.trim()||o.empresa||'Empresa';const pls=$('#nP').value.split('\n').map(s=>s.trim()).filter(Boolean);
 const defP=(pls.length?pls:['Bastidores','Ensino','Opinião']).slice(0,5).map((n,i,a)=>({id:'P'+(i+1),nome:n,pct:Math.round(100/a.length),desc:''}));
 const m=o.marca||{};
 const P={id:uid('f'),tone:S.profiles.length%4,tipo:'cliente',nome,cargo:$('#nC').value.trim()||o.cargo||'Founder',empresa:emp,headline:$('#nH').value.trim()||o.headline||'',
  marca:{posicionamento:m.posicionamento||'A definir na call de diagnóstico.',frase:m.frase||'',publico:m.publico||'A definir.',promessa:m.promessa||'A definir.',pilares:m.pilares||defP,tom:m.tom||{sempre:['Direto','Próximo'],nunca:['Corporativo']},vocabulario:m.vocabulario||[],teses:m.teses||[],historias:m.historias||[],provas:m.provas||[]},
  perfil:o.perfil||{atual:{headline:$('#nH').value.trim(),sobre:''},otimizado:{headline:'',sobre:''}},
  raiox:o.raiox||{nota:null,resumo:'Rode a skill de análise de perfil para preencher o Raio-X.',pontos:[],plano:[]},
  metas:{atual:+$('#nF').value||0,alvo:Math.max(1000,Math.round((+$('#nF').value||0)*1.5)),label:'seguidores em 90 dias'},
  kit:{fr:['pas'],mod:['img','car'],sk:['viral-hook-creator','linkedin-copy','linkedin-anti-ai']},
  ideias:(o.ideias||[]).map(i=>({id:uid('i'),t:i.t,pilar:i.pilar||'P1',origem:i.origem||'Skill',data:TODAY})),ganchos:o.ganchos||[],inbox:[]};
 (o.referencias||[]).forEach(r=>S.refs.push({id:uid('r'),tipo:'perfil',pid:P.id,url:'',titulo:r.nome,nota:r.motivo,data:TODAY}));
 S.profiles.push(P);save();closeModal();toast('Sistema de '+first(nome)+' pronto');setScope(P.id);go('overview')}

let cmdSel=0,cmdItems=[];
function openCmd(){$('#cmd').classList.add('on');const i=$('#cmdIn');i.value='';cmdSel=0;drawCmd();setTimeout(()=>i.focus(),10)}
function closeCmd(){$('#cmd').classList.remove('on')}
function drawCmd(){const raw=$('#cmdIn').value.trim();const q=raw.toLowerCase();const L=[];
 const add=(g,label,icon,run,hint='',d='')=>L.push({g,label,icon,run,hint,d});
 if(raw)add('Ação',`Guardar ideia: “${raw}”`,'bulb',()=>{addIdea(raw)},U.scope==='all'?first(S.profiles[0].nome):first(cur().nome));
 add('Ação','Novo post','plus',()=>newPost(),'N');
 add('Ação',U.theme==='dark'?'Tema claro':'Tema escuro',U.theme==='dark'?'sun':'moon',toggleTheme);
 VIEWS.forEach(v=>add('Ir para',v[1],v[2],()=>go(v[0])));
 add('Perfil','Todos os perfis','users',()=>setScope('all'));
 S.profiles.forEach(p=>add('Perfil',p.nome,'user',()=>setScope(p.id),p.empresa));
 S.posts.slice().sort(byDate).forEach(p=>add('Posts',p.titulo||'Sem título','cal',()=>{if(U.view!=='calendario')go('calendario');setTimeout(()=>openPeek(p.id),30)},first(prof(p.pid).nome)+' · '+fmtS(p.data),p.data));
 cmdItems=q?L.filter(x=>x.label.startsWith('Guardar ideia')||(x.label+' '+x.hint).toLowerCase().includes(q))
  :L.filter(x=>x.g!=='Posts').concat(L.filter(x=>x.g==='Posts'&&x.d>=TODAY).slice(0,5));
 cmdSel=Math.min(cmdSel,Math.max(0,cmdItems.length-1));let lastG='';
 $('#cmdList').innerHTML=cmdItems.map((x,i)=>{const gh=x.g!==lastG?(lastG=x.g,`<div class="cmd-g t-legenda">${x.g}</div>`):'';return gh+`<div class="cmd-i ${i===cmdSel?'on':''}" data-ci="${i}">${I(x.icon)}<span class="ell">${h(x.label)}</span>${x.hint?`<small>${h(x.hint)}</small>`:''}</div>`}).join('')||'<div class="cmd-g t-legenda">Nada encontrado</div>';
 $('#cmdList .cmd-i.on')?.scrollIntoView({block:'nearest'})}
function runCmd(i){const x=cmdItems[i];if(!x)return;closeCmd();x.run()}
$('#cmdIn').addEventListener('input',()=>{cmdSel=0;drawCmd()});
$('#cmdIn').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();cmdSel=Math.min(cmdItems.length-1,cmdSel+1);drawCmd()}else if(e.key==='ArrowUp'){e.preventDefault();cmdSel=Math.max(0,cmdSel-1);drawCmd()}else if(e.key==='Enter'){e.preventDefault();runCmd(cmdSel)}});
$('#cmdList').addEventListener('click',e=>{const it=e.target.closest('[data-ci]');if(it)runCmd(+it.dataset.ci)});
$('#cmdList').addEventListener('mousemove',e=>{const it=e.target.closest('[data-ci]');if(it&&+it.dataset.ci!==cmdSel){cmdSel=+it.dataset.ci;$$('#cmdList .cmd-i').forEach(x=>x.classList.toggle('on',+x.dataset.ci===cmdSel))}});

 if(U.cal.mode==='mes'||U.cal.mode==='lista'||U.cal.mode==='quadro'){if(U.cal.mode==='mes')U.cal.cursor=iso(new Date(d.getFullYear(),d.getMonth(),1))}else U.cal.cursor=p.data;

 copy:t=>copy(t.dataset.t),

  const ok=await copy(p.texto,pronto?'Texto copiado. É só colar no LinkedIn.':`Texto copiado (o post ainda está em "${ST[p.status]}")`);
  if(ok&&t.classList.contains('cp')){t.classList.add('ok');t.innerHTML=I('check2');setTimeout(()=>{if(t.isConnected){t.classList.remove('ok');t.innerHTML=I('copy')}},1400)}},
 toStudio:t=>{const p=post(t.dataset.id);if(U.scope!=='all'&&U.scope!==p.pid)setScope(p.pid);studio={...freshStudio(p.pid),ideia:p.titulo,modelo:p.modelo,pilar:p.pilar,funil:p.funil,titulo:p.arte||'',texto:p.texto||'',data:p.data,editId:p.id};closePeek();go('estudio')},
 dup:t=>{const p=post(t.dataset.id);const c={...p,id:uid('p'),titulo:p.titulo+' (cópia)',status:'ideia',r:null,comentarios:[]};S.posts.push(c);save();renderView();openPeek(c.id);toast('Post duplicado')},
 del:t=>{const lab=t.querySelector('span');if(!t.classList.contains('arm')){t.classList.add('arm');lab.textContent='Clique de novo para excluir';setTimeout(()=>{if(t.isConnected){t.classList.remove('arm');lab.textContent='Excluir'}},2600);return}
  S.posts=S.posts.filter(p=>p.id!==t.dataset.id);save();closePeek();renderView();renderSide();toast('Post excluído')},
 resolveCmt:t=>{const p=post(t.dataset.id);const c=(p.comentarios||[]).find(x=>x.id===t.dataset.c);if(!c)return;c.resolvido=!c.resolvido;save();const b=$('#peek .pk-body');const sc=b?b.scrollTop:0;renderPeek();const b2=$('#peek .pk-body');if(b2)b2.scrollTop=sc;renderView();renderSide();toast(c.resolvido?'Comentário resolvido':'Comentário reaberto')},
 approve:t=>{post(t.dataset.id).status='aprovado';save();renderView();renderSide();toast('Post aprovado')},
 unapprove:t=>{post(t.dataset.id).status='revisar';save();renderView();renderSide()},
 comment:t=>commentModal(t.dataset.id,t.dataset.t),
 cmOk:t=>{const p=post(t.dataset.id);const tx=$('#cmT').value.trim();if(!tx){toast('Escreva o comentário antes');return}const aj=t.dataset.t==='ajuste';
  p.comentarios=p.comentarios||[];p.comentarios.push({id:uid('c'),autor:first(prof(p.pid).nome),tipo:aj?'ajuste':'comentario',texto:tx,data:TODAY,resolvido:false});if(aj)p.status='texto';
  save();closeModal();renderView();renderSide();toast(aj?'Ajuste enviado; o post voltou para Texto pronto':'Comentário enviado')},
 aprLink:()=>copy(location.href.split('#')[0]+'#aprovacao','Link copiado'),
 newProfile:()=>{U.pswOpen=false;renderSide();closeDrawer();profileModal()},
 profOk:createProfile,
 ideaStudio:t=>{const pr=prof(t.dataset.pid);const i=pr.ideias.find(x=>x.id===t.dataset.id);if(U.scope!=='all'&&U.scope!==pr.id)setScope(pr.id);if(studio.pid!==pr.id){if(studio.pid)drafts[studio.pid]=studio;studio=drafts[pr.id]||freshStudio(pr.id)}studio={...studio,ideia:i.t,pilar:i.pilar,titulo:'',texto:'',editId:null,data:nextFree(pr.id)};go('estudio')},
 ideaSched:t=>{const pr=prof(t.dataset.pid);const i=pr.ideias.find(x=>x.id===t.dataset.id);const d=nextFree(pr.id);S.posts.push({id:uid('p'),pid:pr.id,titulo:i.t,status:'ideia',data:d,modelo:pr.kit?.mod[0]||'img',pilar:i.pilar,funil:'topo',texto:'',arte:'',r:null,comentarios:[]});pr.ideias=pr.ideias.filter(x=>x!==i);save();renderView();renderSide();toast('Agendada para '+fmtS(d))},
 ideaDel:t=>{const pr=prof(t.dataset.pid);pr.ideias=pr.ideias.filter(x=>x.id!==t.dataset.id);save();renderView();renderSide();toast('Ideia apagada')},
 kitToggle:t=>{const P=cur();if(!P)return;const k=t.dataset.k,v=t.dataset.v;const a=P.kit[k];const i=a.indexOf(v);if(i>=0)a.splice(i,1);else a.push(v);if(studio.pid===P.id&&k==='sk')studio.skills=null;save();renderView();toast(i>=0?'Tirado do kit de '+first(P.nome):'Adicionado ao kit de '+first(P.nome))},
 refF:t=>{U.refF=t.dataset.v;renderView()},
 refDel:t=>{S.refs=S.refs.filter(r=>r.id!==t.dataset.id);if(studio.ref===t.dataset.id)studio.ref='';save();renderView();renderSide();toast('Referência apagada')},
 refUse:t=>{const r=S.refs.find(x=>x.id===t.dataset.id);if(!r)return;if(r.pid!=='geral'&&U.scope!==r.pid)setScope(r.pid);syncStudio();studio.ref=r.id;go('estudio');toast('Referência pronta no Estúdio')},
 lmSoon:()=>toast('Novos lead magnets entram na próxima versão'),
 device:t=>{U.device=t.dataset.v;renderView()},
 sPick:t=>{studio[t.dataset.k]=t.dataset.v;renderView()},
 sSkill:t=>{const v=t.dataset.v;const a=studio.skills||[];const i=a.indexOf(v);if(i>=0)a.splice(i,1);else a.push(v);studio.skills=a;renderView()},
 sReset:()=>{studio={...freshStudio(studio.pid)};renderView()},
 sSave:()=>{if(!studio.texto.trim()&&!studio.ideia.trim()){toast('Escreva a ideia ou o texto antes');return}
  let id=studio.editId;
  if(id){const p=post(id);Object.assign(p,{pid:studio.pid,titulo:studio.ideia||p.titulo,arte:studio.titulo,texto:studio.texto,modelo:studio.modelo,pilar:studio.pilar,funil:studio.funil,data:studio.data});if(p.texto&&p.status==='ideia')p.status='texto'}
  else{id=uid('p');S.posts.push({id,pid:studio.pid,titulo:(studio.ideia||studio.texto.split('\n')[0]).slice(0,90),arte:studio.titulo,texto:studio.texto,modelo:studio.modelo,pilar:studio.pilar,funil:studio.funil,data:studio.data,status:studio.texto.trim()?'texto':'ideia',r:null,comentarios:[]})}
  save();studio={...freshStudio(studio.pid)};toast('Salvo no calendário');calFocus(id);setTimeout(()=>openPeek(id),120)},
 sGen:async t=>{const P=prof(studio.pid);if(!studio.ideia.trim()){toast('Escolha ou escreva uma ideia');return}
  if(!SAMPLE){studio.texto=draftTemplate(P);if(!studio.titulo)studio.titulo=studio.ideia.slice(0,70);renderView();toast('Rascunho criado');return}
  t.disabled=true;t.innerHTML='<span class="ai-dot"></span>Escrevendo na voz de '+h(first(P.nome))+'…';
  const sk=skillsTxt();const ref=S.refs.find(r=>r.id===studio.ref);
  const prompt=`Você é o ghostwriter de LinkedIn deste perfil. Escreva UM post em português do Brasil.\n\n${brief(P)}\n\nIdeia do post: ${studio.ideia}\nModelo: ${MOD[studio.modelo]}\nFunil: ${FUN[studio.funil]}\nEstrutura: ${FR[studio.frame][0]} (${FR[studio.frame][1]})\n${sk.length?'Skills a aplicar:\n'+sk.map(s=>'- '+s.n+': '+(s.p||s.d)).join('\n')+'\n':''}${ref?`Referência para usar como base (formato e ritmo, sem copiar o texto): ${ref.titulo||''} ${ref.url||''}. Observação: ${ref.nota||''}\n`:''}\nRegras: primeira linha é o gancho e cabe em 210 caracteres junto com a segunda; parágrafos de 1 a 3 frases; use história, número ou prova do perfil quando couber; entre 1.200 e 2.000 caracteres; nunca use a estrutura "Não é X, é Y", nunca termine com frase de efeito ou moral, não use travessão, não use hashtags nem emojis. Responda só com o texto do post.`;
  try{const r=await SAMPLE(prompt,{modelTier:'default',onText:({text})=>{const ta=$('[data-s="texto"]');if(ta){ta.value=text;studio.texto=text;updStudioPrev()}}});studio.texto=r.text.trim();if(!studio.titulo)studio.titulo=studio.ideia.slice(0,70)}catch(err){toast(err&&err.code==='rate_limited'?'Limite de uso; tente em instantes':'Não deu para gerar agora');studio.texto=studio.texto||draftTemplate(P)}
  renderView()},
 sHooks:async()=>{const P=prof(studio.pid);if(!studio.ideia.trim()){toast('Escolha ou escreva uma ideia');return}const box=$('#sHookList');let hooks=null;
  if(SAMPLE){box.innerHTML='<p class="note"><span class="ai-dot"></span> Pensando em ganchos…</p>';try{const r=await SAMPLE(`${brief(P)}\n\nIdeia: ${studio.ideia}\n\nEscreva 5 ganchos de LinkedIn (primeira linha do post, até 120 caracteres cada) na voz deste perfil, cada um usando um padrão diferente entre: ${HOOKS.join(', ')}. Sem emojis, sem travessão, sem "Não é X, é Y". Responda só com JSON: [{"padrao":"...","texto":"..."}]`,{modelTier:'quick'});hooks=JSON.parse(r.text.slice(r.text.indexOf('['),r.text.lastIndexOf(']')+1))}catch(e){hooks=null}}
  if(!hooks)hooks=P.ganchos.length?P.ganchos:[{padrao:'O Específico',texto:'Comece pelo número mais concreto da história.'}];
  box.innerHTML='<span class="lbl">Clique para usar como abertura</span><ul class="hooks">'+hooks.map(g=>`<li><button class="${B.s} sm" data-act="useHook" data-t="${h(g.texto)}">Usar</button><span>${h(g.texto)}<small>${h(g.padrao)}</small></span></li>`).join('')+'</ul>'},
 useHook:t=>{const ta=$('[data-s="texto"]');const v=ta.value.trim()?ta.value.replace(/^[^\n]*/,t.dataset.t):t.dataset.t+'\n\n';ta.value=v;studio.texto=v;updStudioPrev();toast('Gancho aplicado')}
};
document.addEventListener('click',e=>{
 if(U.pswOpen&&!e.target.closest('.sb-psw')&&!e.target.closest('.active-chip')){U.pswOpen=false;renderSide()}
 const t=e.target.closest('[data-act]');if(!t)return;if(t.tagName==='A')return;const a=t.dataset.act;if(ACT[a]){if(t.tagName==='BUTTON'||a==='open')e.preventDefault();ACT[a](t,e)}});
document.addEventListener('keydown',e=>{
 const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)||document.activeElement?.isContentEditable;
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#cmd').classList.contains('on')?closeCmd():openCmd();return}
 if(e.key==='Escape'){if($('#cmd').classList.contains('on'))closeCmd();else if($('#ov').classList.contains('on'))closeModal();else if(U.peek)closePeek();else if(U.pswOpen){U.pswOpen=false;renderSide()}else closeDrawer();return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='b'&&!typing){e.preventDefault();ACT.sbToggle();return}
 if(!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&e.key.toLowerCase()==='n'&&!$('#cmd').classList.contains('on')&&!$('#ov').classList.contains('on')){e.preventDefault();newPost();return}
 if(!typing&&(e.key==='Enter'||e.key===' ')&&document.activeElement?.getAttribute('role')==='button'){e.preventDefault();document.activeElement.click()}
});
document.addEventListener('input',e=>{const el=e.target;
 if(el.matches('[data-psw-q]')){const q=el.value.trim().toLowerCase();$$('#psw .psw-list [data-n]').forEach(b=>b.style.display=!q||b.dataset.n.includes(q)?'':'none');return}
 if(el.dataset.f&&el.closest('#peek')&&el.tagName==='TEXTAREA'){const p=post(U.peek);if(!p)return;p[el.dataset.f]=el.value;autosize(el);if(el.dataset.f==='texto'){$('#pkCount').innerHTML=`<b>${el.value.length}</b> caracteres`}if(['texto','arte','titulo'].includes(el.dataset.f))$('#pkPrev').innerHTML=liPost(p);save();renderViewSoon();return}
 if(el.dataset.s&&['texto','titulo','ideia'].includes(el.dataset.s)){studio[el.dataset.s]=el.value;updStudioPrev()}
});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.f&&el.closest('#peek')&&el.tagName!=='TEXTAREA'){const p=post(U.peek);if(!p)return;const f=el.dataset.f;if(f==='data'&&!el.value)return;p[f]=el.value;if(f==='pid'){const pr=prof(el.value);p.pilar=pr.marca.pilares[0]?.id||''}save();renderPeek();renderView();renderSide();return}
 if(el.dataset.filter){U.f[el.dataset.filter]=el.value;renderView();return}
 if(el.dataset.r){const p=post(el.dataset.r);p.r=p.r||{};p.r[el.dataset.k]=el.value===''?null:+String(el.value).replace(/\D/g,'');save();if(!el.closest('#peek'))renderView();return}
 if(el.dataset.s){const k=el.dataset.s;
  if(k==='pid'){setScope(el.value);return}
  if(k==='ideiaSel'){studio.ideia=el.value;const i=prof(studio.pid).ideias.find(x=>x.t===el.value);if(i)studio.pilar=i.pilar;renderView();if(!el.value)setTimeout(()=>$('[data-s="ideia"]')?.focus(),20);return}
  studio[k]=el.value;if(k==='data'||k==='ref')renderView();else updStudioPrev()}
});
document.addEventListener('submit',e=>{const f=e.target;const kind=f.dataset.form;if(!kind)return;e.preventDefault();const fd=new FormData(f);
 if(kind==='idea'){const t=String(fd.get('t')||'').trim();if(!t){f.querySelector('input').focus();return}addIdea(t,fd.get('pid')||null,fd.get('pilar')||null);setTimeout(()=>$('form[data-form="idea"] input')?.focus(),20);return}
 if(kind==='ref'){let url=String(fd.get('url')||'').trim();const nota=String(fd.get('nota')||'').trim();if(!url&&!nota){toast('Cole o link ou escreva uma observação');return}
  if(url&&!/^https?:\/\//i.test(url))url='https://'+url.replace(/^\/+/,'');
  S.refs.push({id:uid('r'),tipo:fd.get('tipo')==='perfil'?'perfil':'post',pid:String(fd.get('pid')||'geral'),url,titulo:'',nota,data:TODAY});save();renderView();renderSide();toast('Referência salva');return}
 if(kind==='lm'){toast('A geração do PDF entra na próxima versão');return}
});
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target instanceof Element&&e.target.closest('.pc[draggable]');if(!c)return;dragId=c.dataset.id;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}requestAnimationFrame(()=>c.classList.add('dragging'))});
document.addEventListener('dragend',()=>{$$('.dragging').forEach(x=>x.classList.remove('dragging'));$$('.over').forEach(x=>x.classList.remove('over'));dragId=null});
document.addEventListener('dragover',e=>{if(!dragId)return;const z=e.target instanceof Element&&e.target.closest('[data-drop],[data-drop-st]');if(!z)return;e.preventDefault();e.dataTransfer.dropEffect='move';$$('.over').forEach(x=>x!==z&&x.classList.remove('over'));z.classList.add('over')});
document.addEventListener('dragleave',e=>{const z=e.target instanceof Element&&e.target.closest('[data-drop],[data-drop-st]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over')});
document.addEventListener('drop',e=>{if(!dragId)return;const z=e.target instanceof Element&&e.target.closest('[data-drop],[data-drop-st]');if(!z)return;e.preventDefault();const p=post(dragId);if(!p)return;
 if(z.dataset.drop){if(p.data===z.dataset.drop)return;p.data=z.dataset.drop;toast('Movido para '+fmtS(p.data))}else{if(p.status===z.dataset.dropSt)return;p.status=z.dataset.dropSt;toast(ST[p.status])}
 save();renderView();renderSide();if(U.peek===p.id)renderPeek()});
matchMedia('(max-width:719px)').addEventListener('change',()=>{if(U.view==='calendario')renderView()});

/* Regra do design system: sem Manrope, não segue com outra fonte. */
document.fonts.ready.then(()=>{if(!document.fonts.check('16px Manrope')){const b=document.createElement('div');b.className='fontbar';b.textContent='A fonte Manrope não carregou. Confira se a pasta artie-design-system está ao lado deste arquivo.';document.body.appendChild(b)}});

route();
})();
</script>
